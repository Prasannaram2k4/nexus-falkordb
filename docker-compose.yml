version: '3.8'

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkordb-server
    ports:
      - "6379:6379"
      - "3000:3000" # FalkorDB Web Browser UI
    volumes:
      - falkordb-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nexus-api:
    build: .
    container_name: nexus-company-brain
    depends_on:
      falkordb:
        condition: service_healthy
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_GRAPH_NAME=company_brain
      - API_HOST=0.0.0.0
      - API_PORT=8000
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  falkordb-data:
